<text x="24.0" y="54.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6b75" text-anchor="start" font-weight="normal">Les câbles forment un graphe ; les machines branchées en sont les extrémités. Un seul bilan par tick.</text>
