<text x="380.0" y="278.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6b75" text-anchor="middle" font-weight="normal">moteur</text>
<rect x="140.0" y="224.0" width="40.0" height="40.0" fill="#d8ecc9" rx="6" stroke="#3f8f5a" stroke-width="2"/>
<text x="160.0" y="245.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3f8f5a" text-anchor="middle" font-weight="bold">Both</text>
<text x="160.0" y="278.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6b75" text-anchor="middle" font-weight="normal">batterie</text>
<rect x="100.0" y="140.0" width="252.0" height="120.0" fill="none" rx="10" stroke="#4a5d6b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="100.0" y="130.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#4a5d6b" text-anchor="start" font-weight="normal">un réseau = composante connexe de câbles</text>
<text x="480.0" y="110.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#22303a" text-anchor="start" font-weight="bold">Le bilan d'un tick, dans la limite du débit :</text>
<rect x="480.0" y="124.0" width="440.0" height="30.0" fill="#f3f6f8" rx="6" stroke="#4a5d6b" stroke-width="1"/>
<text x="492.0" y="144.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">1. Producteurs (Out) → consommateurs (In), au prorata</text>
<rect x="480.0" y="164.0" width="440.0" height="30.0" fill="#f3f6f8" rx="6" stroke="#4a5d6b" stroke-width="1"/>
<text x="492.0" y="184.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">2. Surplus → tampons (Both : batteries, réservoirs)</text>
<rect x="480.0" y="204.0" width="440.0" height="30.0" fill="#f3f6f8" rx="6" stroke="#4a5d6b" stroke-width="1"/>
<text x="492.0" y="224.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">3. Tampons → consommateurs encore en manque</text>
<rect x="480.0" y="244.0" width="440.0" height="30.0" fill="#f3f6f8" rx="6" stroke="#4a5d6b" stroke-width="1"/>
<text x="492.0" y="264.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">4. Équilibrage des tampons entre eux</text>
<text x="480.0" y="300.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b75" text-anchor="start" font-weight="normal">Le contenu ne voyage pas de câble en câble : 3 câbles ou 300,</text>
<text x="480.0" y="316.2" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b75" text-anchor="start" font-weight="normal">tout le réseau est servi dans le même tick.</text>
<text x="480.0" y="332.4" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b75" text-anchor="start" font-weight="normal">Poser ou casser un câble marque le réseau « sale » :</text>
<text x="480.0" y="348.6" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b75" text-anchor="start" font-weight="normal">il est reconstruit au tick suivant (parcours en largeur).</text>
</svg>
