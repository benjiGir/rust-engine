<rect x="370.0" y="210.0" width="38.0" height="38.0" fill="#cfd6db" rx="3" stroke="#22303a" stroke-width="1"/>
<rect x="330.0" y="170.0" width="38.0" height="38.0" fill="#f1dcc9" rx="3" stroke="#b8692f" stroke-width="1.5"/>
<text x="349.0" y="194.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#b8692f" text-anchor="middle" font-weight="bold">barre</text>
<ellipse cx="260" cy="110" rx="70" ry="38" fill="#f6d9d6" stroke="#c8443a" stroke-width="1.5"/>
<line x1="220.0" y1="140.0" x2="210.0" y2="210.0" stroke="#22303a" stroke-width="1"/>
