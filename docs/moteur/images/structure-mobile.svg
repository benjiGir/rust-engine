<line x1="285.0" y1="300.0" x2="285.0" y2="345.0" stroke="#22303a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="292.0" y="340.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#22303a" text-anchor="start" font-weight="normal">gravité</text>
<line x1="200.0" y1="330.0" x2="200.0" y2="296.0" stroke="#3f84c6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="192.0" y="326.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1d4f7a" text-anchor="end" font-weight="normal">flottaison : 1,6 par bloc immergé</text>
<line x1="500.0" y1="236.0" x2="500.0" y2="196.0" stroke="#3f8f5a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="500.0" y1="236.0" x2="540.0" y2="236.0" stroke="#3f8f5a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="496.0" y="196.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#3f8f5a" text-anchor="end" font-weight="bold">y</text>
<text x="500.0" y="254.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#3f8f5a" text-anchor="start" font-weight="bold">repère local</text>
<text x="590.0" y="100.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">1. Extraction : les blocs reliés à l'assembleur</text>
<text x="590.0" y="116.2" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">   (sauf le terrain) quittent le monde pour une</text>
<text x="590.0" y="132.4" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">   SubGrid, un vrai petit World.</text>
<text x="590.0" y="148.6" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal"></text>
<text x="590.0" y="164.8" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">2. Physique à 4 degrés de liberté :</text>
<text x="590.0" y="181.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">   position + lacet ; gravité, flottaison,</text>
<text x="590.0" y="197.2" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">   ballons, hélices (et leur couple), barre.</text>
<text x="590.0" y="213.4" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal"></text>
<text x="590.0" y="229.6" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">3. Machines, ticks et réseaux tournent en</text>
<text x="590.0" y="245.8" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">   coordonnées locales, sans voir le mouvement.</text>
<text x="590.0" y="262.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal"></text>
<text x="590.0" y="278.2" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">4. Le joueur posé dessus (OnGrid) marche</text>
<text x="590.0" y="294.4" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">   dans le repère de la structure.</text>
<text x="590.0" y="310.6" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal"></text>
<text x="590.0" y="326.8" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#22303a" text-anchor="start" font-weight="normal">5. Réassemblage aligné au quart de tour.</text>
</svg>
