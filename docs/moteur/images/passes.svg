<text x="353.0" y="160.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#22303a" text-anchor="middle" font-weight="bold">Ciel</text>
<text x="353.0" y="180.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6b75" text-anchor="middle" font-weight="normal">pixels vides</text>
<line x1="413.0" y1="152.0" x2="425.0" y2="152.0" stroke="#b8692f" stroke-width="1.5" marker-end="url(#arrowc)"/>
<rect x="426.0" y="96.0" width="118.0" height="112.0" fill="#cfe3f5" rx="10" stroke="#3f84c6" stroke-width="1.5"/>
<circle cx="446.0" cy="118.0" r="12" fill="#3f84c6"/>
