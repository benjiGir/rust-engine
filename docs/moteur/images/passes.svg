<text x="485.0" y="160.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#22303a" text-anchor="middle" font-weight="bold">Translucide</text>
<text x="485.0" y="180.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6b75" text-anchor="middle" font-weight="normal">loin → près</text>
<line x1="545.0" y1="152.0" x2="557.0" y2="152.0" stroke="#b8692f" stroke-width="1.5" marker-end="url(#arrowc)"/>
<rect x="558.0" y="96.0" width="118.0" height="112.0" fill="#f3f6f8" rx="10" stroke="#22303a" stroke-width="1.5"/>
<circle cx="578.0" cy="118.0" r="12" fill="#22303a"/>
<text x="578.0" y="122.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="617.0" y="160.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#22303a" text-anchor="middle" font-weight="bold">Lignes</text>
<text x="617.0" y="180.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6b75" text-anchor="middle" font-weight="normal">contour, réticule</text>
<line x1="677.0" y1="152.0" x2="689.0" y2="152.0" stroke="#b8692f" stroke-width="1.5" marker-end="url(#arrowc)"/>
<rect x="690.0" y="96.0" width="118.0" height="112.0" fill="#fbefc9" rx="10" stroke="#b8901e" stroke-width="1.5"/>
<circle cx="710.0" cy="118.0" r="12" fill="#b8901e"/>
