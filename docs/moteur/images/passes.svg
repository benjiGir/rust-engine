<text x="749.0" y="160.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#22303a" text-anchor="middle" font-weight="bold">Bras</text>
<text x="749.0" y="180.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6b75" text-anchor="middle" font-weight="normal">profondeur effacée</text>
<line x1="809.0" y1="152.0" x2="821.0" y2="152.0" stroke="#b8692f" stroke-width="1.5" marker-end="url(#arrowc)"/>
<rect x="822.0" y="96.0" width="118.0" height="112.0" fill="#e6def2" rx="10" stroke="#7a5ea8" stroke-width="1.5"/>
<circle cx="842.0" cy="118.0" r="12" fill="#7a5ea8"/>
<text x="842.0" y="122.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<text x="881.0" y="160.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#22303a" text-anchor="middle" font-weight="bold">Interface</text>
<text x="881.0" y="180.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6b75" text-anchor="middle" font-weight="normal">egui</text>
<text x="162.0" y="236.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#b8692f" text-anchor="start" font-weight="normal">← tampon de profondeur écrit</text>
<text x="426.0" y="236.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f84c6" text-anchor="start" font-weight="normal">← testé, non écrit (mélange alpha)</text>
<text x="30.0" y="270.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b75" text-anchor="start" font-weight="normal">Le GPU chronomètre la passe principale (timestamps relus 3 images plus tard). Puis la présentation à l'écran (VSync).</text>
</svg>
