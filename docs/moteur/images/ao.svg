<text x="40.0" y="316.2" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b75" text-anchor="start" font-weight="normal">Le shader multiplie la lumière par 0,45 + 0,55 × AO / 3 : un coin enfermé descend à 45 %.</text>
<text x="40.0" y="332.4" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b75" text-anchor="start" font-weight="normal">La lumière douce fait la moyenne des 4 cellules d'air autour du coin, sur le même principe.</text>
