<text x="533.0" y="207.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#22303a" text-anchor="start" font-weight="normal">fin de l'image 4 : reste 11.7 ms → alpha = reste / pas ≈ 0.70</text>
<text x="120.0" y="246.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b75" text-anchor="start" font-weight="normal">Chaque image ajoute sa durée à un accumulateur (plafonnée à 250 ms) et joue autant de pas entiers qu'il contient.</text>
<text x="120.0" y="262.2" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b75" text-anchor="start" font-weight="normal">render(alpha) dessine la caméra et les créatures entre le pas précédent et le pas courant :</text>
<text x="120.0" y="278.4" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b75" text-anchor="start" font-weight="normal">le mouvement reste fluide à 144 images/s alors que la physique tourne à 60 Hz.</text>
