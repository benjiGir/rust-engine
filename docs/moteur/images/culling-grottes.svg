<text x="212.0" y="186.4" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#22303a" text-anchor="start" font-weight="bold">caméra</text>
<rect x="520.0" y="100.0" width="22.0" height="22.0" fill="#ffffff" rx="4" stroke="#b8692f" stroke-width="2.2"/>
<text x="552.0" y="116.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#22303a" text-anchor="start" font-weight="normal">dessiné (atteint par un chemin d'air)</text>
<rect x="520.0" y="136.0" width="22.0" height="22.0" fill="url(#hatch)" rx="4" stroke="#4a5d6b" stroke-width="1"/>
<text x="552.0" y="152.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#22303a" text-anchor="start" font-weight="normal">sauté (grotte isolée, roche pleine)</text>
<text x="520.0" y="196.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#22303a" text-anchor="start" font-weight="normal">1. Au maillage, chaque zone d'air d'un chunk note</text>
<text x="520.0" y="212.9" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#22303a" text-anchor="start" font-weight="normal">   quelles faces du chunk elle relie (15 paires).</text>
<text x="520.0" y="229.8" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#22303a" text-anchor="start" font-weight="normal">2. À chaque image, on part du chunk de la caméra</text>
<text x="520.0" y="246.6" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#22303a" text-anchor="start" font-weight="normal">   et on avance en largeur, en n'entrant dans un voisin</text>
<text x="520.0" y="263.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#22303a" text-anchor="start" font-weight="normal">   que par une face reliée à celle d'entrée,</text>
<text x="520.0" y="280.4" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#22303a" text-anchor="start" font-weight="normal">   sans revenir vers la caméra.</text>
<text x="520.0" y="297.2" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#22303a" text-anchor="start" font-weight="normal"></text>
<text x="520.0" y="314.1" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#22303a" text-anchor="start" font-weight="normal">Prudent : un chunk caché peut rester dessiné,</text>
<text x="520.0" y="331.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#22303a" text-anchor="start" font-weight="normal">un chunk visible n'est jamais retiré.</text>
</svg>
