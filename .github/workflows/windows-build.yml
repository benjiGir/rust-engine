name: Build Windows

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p voxel
      - name: Assembler le dossier du jeu
        shell: bash
        run: |
          mkdir dist
          cp target/release/voxel.exe dist/
          cp -r assets mods dist/
          find dist/mods -name script -type d -prune -exec rm -rf {} +
      - uses: actions/upload-artifact@v4
        with:
          name: voxel-windows
          path: dist
