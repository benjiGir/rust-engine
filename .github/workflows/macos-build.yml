name: Build macOS manuel

# Le dossier du jeu à distribuer, fabriqué par `cargo xtask package` (voir docs/plan-installation.md) :
# voxel, voxel-server, game/, mods/, texture_packs/, shader_packs/ et LISEZMOI.txt, zippés.

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture du Mac
        type: choice
        required: true
        default: arm64
        options:
          - arm64
          - x86_64

permissions:
  contents: read

jobs:
  build:
    name: macOS (${{ inputs.architecture }})
    runs-on: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUST_TARGET: ${{ inputs.architecture == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Rust
        run: |
          # rust-toolchain.toml choisit la version ; on ajoute la cible du Mac et celle des mods.
          rustup show
          rustup target add "$RUST_TARGET" wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Fabriquer le dossier du jeu
        run: cargo xtask package --target "$RUST_TARGET"

      - name: Noter le commit
        run: |
          set -euo pipefail
          for dir in dist/Voxel-*/; do
            printf 'Commit : %s\nCible : %s\n' "$GITHUB_SHA" "$RUST_TARGET" > "$dir/build-info.txt"
          done
          # L'archive est refaite pour inclure build-info.txt (ditto garde les droits d'exécution).
          for dir in dist/Voxel-*/; do
            name="$(basename "$dir")"
            rm -f "dist/$name.zip"
            (cd dist && ditto -c -k --norsrc --noextattr --noacl --keepParent "$name" "$name.zip")
          done
          ls -l dist

      - name: Publier l'archive telechargeable
        uses: actions/upload-artifact@v7
        with:
          name: voxel-macos-${{ inputs.architecture }}
          path: dist/Voxel-*.zip
          if-no-files-found: error
          retention-days: 30
          # Déjà compressée : l'archive du téléchargement la contient telle quelle.
          compression-level: 0
