[workspace]
resolver = "3"
# Ajoute chaque nouvelle crate ici au fil des phases.
members = [
    "exercises/game_of_life",
    "crates/engine_core",
    "crates/engine_render",
    "crates/engine_voxel",
    "crates/engine_ecs",
    "crates/engine_mods",
    "crates/engine_trace",
    "crates/mod_sdk",
    "tools/xtask",
    "mods/example/script",
    "mods/entrepot/script",
    "mods/mecanique/script",
    "mods/magie/script",
    "mods/donjons/script",
    "crates/engine_inspect",
    "crates/engine_inspect_derive",
    "games/voxel",
    "tools/assetgen",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# Versions partagées par toutes les crates du workspace.
# Une crate les utilise avec `winit = { workspace = true }`.
# On fige winit et wgpu : leur API change souvent entre deux versions.
[workspace.dependencies]
engine_core = { path = "crates/engine_core" }
engine_render = { path = "crates/engine_render" }
engine_voxel = { path = "crates/engine_voxel" }
engine_ecs = { path = "crates/engine_ecs" }
engine_mods = { path = "crates/engine_mods" }
mod_sdk = { path = "crates/mod_sdk" }
engine_trace = { path = "crates/engine_trace" }
engine_inspect = { path = "crates/engine_inspect" }
engine_inspect_derive = { path = "crates/engine_inspect_derive" }
winit = "0.30.13"
wgpu = "30.0.1"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
# Lecture des fichiers de données (blocs, mods) au format RON.
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.3"
# Bruit procédural (Perlin, fBm) pour le terrain.
noise = "0.9.0"
# Pool de threads (« work stealing ») et canaux entre threads.
rayon = "1.12.0"
crossbeam-channel = "0.5.17"
# Écriture des captures d'écran (mode VOXEL_SCREENSHOTS du jeu).
png = "0.18.1"
# Sauvegarde : format binaire compact (serde) et compression rapide.
postcard = { version = "1.1.3", features = ["use-std"] }
lz4_flex = "0.14.0"
# Textures : lecture des PNG.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Rechargement à chaud : surveillance des fichiers.
notify = "8"
# Audio.
kira = { version = "0.12.6", default-features = false, features = ["cpal", "wav", "pcm"] }
# Interface de debug et d'inventaire (mêmes versions de wgpu et winit que le moteur).
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = { version = "0.37.0", default-features = false }
# Macro procédurale `#[derive(Inspect)]`.
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# ECS de référence, pour comparer le nôtre.
hecs = "0.11.2"
# Tables de hachage rapides (FxHash) pour les positions de blocs et de chunks.
rustc-hash = "2"
# Mods : versions sémantiques et scripts WebAssembly (bac à sable).
semver = { version = "1.0.28", features = ["serde"] }
wasmtime = "50"
# Benchmarks : `cargo bench -p engine_voxel`.
criterion = "0.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Optimise les dépendances même en debug : indispensable dès qu'on fait du rendu.
[profile.dev.package."*"]
opt-level = 2

# `"*"` ne vise que les dépendances externes, pas nos crates. Le maillage parcourt
# des millions de blocs : sans optimisation, mailler le monde prend plusieurs secondes.
[profile.dev.package.engine_voxel]
opt-level = 3
