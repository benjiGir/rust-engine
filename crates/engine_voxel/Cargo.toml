[package]
name = "engine_voxel"
description = "Monde voxel : blocs, chunks, génération procédurale, maillage et chargement en tâche de fond."
edition.workspace = true
version.workspace = true
license.workspace = true

# Aucune dépendance graphique : on peut tester et mesurer le maillage sans GPU.
[dependencies]
engine_trace = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
noise = { workspace = true }
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
anyhow = { workspace = true }
postcard = { workspace = true }
lz4_flex = { workspace = true }
log = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Les exemples (`examples/worldmap.rs`) écrivent des cartes en PNG.
png = { workspace = true }

# `harness = false` : criterion fournit sa propre fonction `main` à la place
# du lanceur de tests intégré à Rust.
[[bench]]
name = "meshing"
harness = false

[[bench]]
name = "generation"
harness = false

[[bench]]
name = "save"
harness = false

[[bench]]
name = "machines"
harness = false

[lints]
workspace = true

[[bench]]
name = "fluids"
harness = false
